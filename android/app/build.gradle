plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.pitstock.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.pitstock.app"
        minSdk = 21          // ML Kit & camera require 21+
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
    }

buildTypes {
    release {
        // Use debug signing so `flutter build apk` works out-of-the-box.
        signingConfig = signingConfigs.debug
        minifyEnabled = false
        shrinkResources = false
    }
}
}

flutter {
    source = "../.."
}
